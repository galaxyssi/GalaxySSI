// Build production Kotlin and real dependencies under a disposable, non-launchable package.
// Never use this init script for release packaging or for shipping artifacts.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                    throw new GradleException('Isolated MQTT verification only supports debug builds')
                }
                android.defaultConfig.applicationId = 'com.galaxyssi.chat.mqttverification'
                android.defaultConfig.testApplicationId = 'com.galaxyssi.chat.mqttverification.test'
                android.defaultConfig.testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
                android.sourceSets.main.manifest.srcFile(project.rootProject.file('../../tools/dev/mqtt-isolated/AndroidManifest.xml'))
                android.sourceSets.debug.manifest.srcFile(project.rootProject.file('../../tools/dev/mqtt-isolated/AndroidManifest.xml'))
                android.sourceSets.main.assets.setSrcDirs([])
                android.sourceSets.main.jniLibs.setSrcDirs([])
                android.externalNativeBuild.cmake.path = null
            }
        }
    }
    if (project.path == ':llama-runtime') {
        project.plugins.withId('com.android.library') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.externalNativeBuild.cmake.path = null
                android.sourceSets.main.jniLibs.setSrcDirs([])
            }
        }
    }
}
