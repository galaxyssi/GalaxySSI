name: Android QEMU Bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-qemu-bundle.yml"
      - "apps/android/runtime/qemu/**"
      - "tools/runtime/android-elf-*.mjs"
      - "tools/runtime/build-android-qemu.sh"
      - "tools/runtime/collect-android-elf-bundle.mjs"
      - "tools/runtime/normalize-android-elf-bundle.mjs"
      - "tools/runtime/verify-android-qemu-elf.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-qemu-bundle.yml"
      - "apps/android/runtime/qemu/**"
      - "tools/runtime/android-elf-*.mjs"
      - "tools/runtime/build-android-qemu.sh"
      - "tools/runtime/collect-android-elf-bundle.mjs"
      - "tools/runtime/normalize-android-elf-bundle.mjs"
      - "tools/runtime/verify-android-qemu-elf.mjs"

permissions:
  contents: read

concurrency:
  group: android-qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qemu-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm patchelf

      - name: Restore exact QEMU bundle cache
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: |
            build/runtime/android-jni-libs
            build/runtime/android-assets/runtime/qemu
          key: android-qemu-v3-${{ runner.os }}-${{ hashFiles('tools/runtime/build-android-qemu.sh', 'tools/runtime/android-elf-*.mjs', 'tools/runtime/collect-android-elf-bundle.mjs', 'tools/runtime/normalize-android-elf-bundle.mjs', 'tools/runtime/verify-android-qemu-elf.mjs', 'apps/android/runtime/qemu/**') }}

      - name: Inspect restored QEMU bundle
        id: qemu-state
        run: |
          if [[ -f build/runtime/android-jni-libs/galaxyssi-qemu-bundle.json && \
                -f build/runtime/android-jni-libs/arm64-v8a/libgalaxyssi_qemu.so && \
                -f build/runtime/android-assets/runtime/qemu/bundle.json ]] && \
              npm run runtime:verify-android-qemu-elf -- \
                --jni-root build/runtime/android-jni-libs \
                --readelf llvm-readelf; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf build/runtime/android-jni-libs build/runtime/android-assets/runtime/qemu
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android QEMU engine
        if: steps.qemu-state.outputs.ready != 'true'
        run: npm run runtime:build-android-qemu

      - name: Normalize Android QEMU libraries
        run: |
          npm run runtime:normalize-android-qemu -- \
            --jni-root build/runtime/android-jni-libs \
            --asset-root build/runtime/android-assets

      - name: Verify Android QEMU bundle
        run: |
          npm run runtime:verify-android-qemu-elf -- \
            --jni-root build/runtime/android-jni-libs \
            --readelf llvm-readelf

      - name: Upload Android QEMU bundle
        uses: actions/upload-artifact@v4
        with:
          name: GalaxySSI-Android-qemu-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            build/runtime/android-jni-libs
            build/runtime/android-assets/runtime/qemu
