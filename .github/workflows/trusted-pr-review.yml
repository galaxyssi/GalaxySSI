name: Trusted PR Review

on:
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write

concurrency:
  group: trusted-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-automation-review:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate automated review identity and CI state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/security/check-trusted-pr-review.mjs
