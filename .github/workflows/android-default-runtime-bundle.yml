name: Android Default Runtime Bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-default-runtime-bundle.yml"
      - "apps/android/runtime/buildroot-external/**"
      - "apps/android/runtime/guest/**"
      - "tools/runtime/android-default-runtime*.mjs"
      - "tools/runtime/build-linux-base.sh"
      - "tools/runtime/build-python-uv-image.sh"
      - "tools/runtime/build-runtime-image.mjs"
      - "tools/runtime/prepare-android-default-runtime.mjs"
      - "tools/runtime/runtime-download.sh"
      - "tools/runtime/runtime-image.mjs"
      - "tools/runtime/runtime-signing.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-default-runtime-bundle.yml"
      - "apps/android/runtime/buildroot-external/**"
      - "apps/android/runtime/guest/**"
      - "tools/runtime/android-default-runtime*.mjs"
      - "tools/runtime/build-linux-base.sh"
      - "tools/runtime/build-python-uv-image.sh"
      - "tools/runtime/build-runtime-image.mjs"
      - "tools/runtime/prepare-android-default-runtime.mjs"
      - "tools/runtime/runtime-download.sh"
      - "tools/runtime/runtime-image.mjs"
      - "tools/runtime/runtime-signing.mjs"

permissions:
  contents: read

concurrency:
  group: android-default-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-default-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNTIME_SIGNING_CERTIFICATE: ${{ secrets.RUNTIME_SIGNING_CERTIFICATE }}
      RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.RUNTIME_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc bison build-essential cpio file flex libelf-dev libncurses-dev libssl-dev \
            llvm make openssl patchelf python3 rsync squashfs-tools unzip wget xz-utils

      - name: Prepare runtime signing identity
        run: |
          mkdir -p build/runtime/signing
          if [[ -n "$RUNTIME_SIGNING_CERTIFICATE" && -n "$RUNTIME_SIGNING_PRIVATE_KEY" ]]; then
            printf '%s\n' "$RUNTIME_SIGNING_CERTIFICATE" > build/runtime/signing/runtime-cert.pem
            printf '%s\n' "$RUNTIME_SIGNING_PRIVATE_KEY" > build/runtime/signing/runtime-key.pem
          else
            openssl req -x509 -newkey rsa:3072 -nodes -days 7 \
              -subj "/CN=SignalASI Android Runtime Development/" \
              -keyout build/runtime/signing/runtime-key.pem \
              -out build/runtime/signing/runtime-cert.pem
          fi

      - name: Restore verified QEMU bundle
        uses: actions/cache@v4
        with:
          path: |
            build/runtime/android-jni-libs
            build/runtime/android-assets/runtime/qemu
          key: android-qemu-v3-${{ runner.os }}-${{ hashFiles('tools/runtime/build-android-qemu.sh', 'tools/runtime/android-elf-*.mjs', 'tools/runtime/collect-android-elf-bundle.mjs', 'tools/runtime/normalize-android-elf-bundle.mjs', 'tools/runtime/verify-android-qemu-elf.mjs', 'apps/android/runtime/qemu/**') }}

      - name: Verify required QEMU bundle
        run: |
          npm run runtime:verify-android-qemu-elf -- \
            --jni-root build/runtime/android-jni-libs \
            --readelf llvm-readelf

      - name: Restore exact default runtime cache
        uses: actions/cache@v4
        with:
          path: |
            build/runtime/release/linux-base-1.3.8-arm64-v8a.img
            build/runtime/release/linux-base-1.3.8-arm64-v8a.img.config.json
            build/runtime/release/python-uv-0.12.1-arm64-v8a.img
            build/runtime/release/python-uv-0.12.1-arm64-v8a.img.config.json
          key: android-default-runtime-images-v3-${{ runner.os }}-${{ hashFiles('tools/runtime/build-linux-base.sh', 'tools/runtime/build-python-uv-image.sh', 'tools/runtime/runtime-download.sh', 'tools/runtime/runtime-image.mjs', 'tools/runtime/build-runtime-image.mjs', 'apps/android/runtime/buildroot-external/**', 'apps/android/runtime/guest/**') }}

      - name: Inspect restored default runtime images
        id: default-runtime
        run: |
          if [[ -s build/runtime/release/linux-base-1.3.8-arm64-v8a.img && \
                -s build/runtime/release/linux-base-1.3.8-arm64-v8a.img.config.json && \
                -s build/runtime/release/python-uv-0.12.1-arm64-v8a.img && \
                -s build/runtime/release/python-uv-0.12.1-arm64-v8a.img.config.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            rm -f build/runtime/release/linux-base-1.3.8-arm64-v8a.img* \
              build/runtime/release/python-uv-0.12.1-arm64-v8a.img*
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build default Linux and Python images
        if: steps.default-runtime.outputs.ready != 'true'
        run: |
          mkdir -p build/runtime/release
          npm run runtime:build-linux-base -- "$PWD/build/runtime/release/linux-base-1.3.8-arm64-v8a.img"
          npm run runtime:build-python-uv -- "$PWD/build/runtime/release/python-uv-0.12.1-arm64-v8a.img"
          node --input-type=module <<'NODE'
          import { statSync, writeFileSync } from 'node:fs';
          const image = 'linux-base-1.3.8-arm64-v8a.img';
          const path = `build/runtime/release/${image}`;
          writeFileSync(`${path}.config.json`, `${JSON.stringify({
            id: 'linux-base',
            version: '1.3.8',
            architecture: 'arm64-v8a',
            image,
            image_file: image,
            capabilities: ['shell.execute'],
            dependencies: [],
            installed_size_bytes: statSync(path).size + 1024 * 1024,
            license: 'GPL-2.0-only AND GPL-2.0-or-later AND LGPL-2.1-or-later',
            minimum_host_version_code: 69,
            guest_api_version: 1,
            release_notes: 'Bundled SignalASI Linux base environment'
          }, null, 2)}\n`);
          NODE

      - name: Build signed default runtime packs
        run: |
          for config in \
            build/runtime/release/linux-base-1.3.8-arm64-v8a.img.config.json \
            build/runtime/release/python-uv-0.12.1-arm64-v8a.img.config.json; do
            npm run runtime:build-pack -- \
              --config "$config" \
              --output "${config%.img.config.json}.sarpack" \
              --certificate build/runtime/signing/runtime-cert.pem \
              --key build/runtime/signing/runtime-key.pem
          done

      - name: Prepare and verify Android bootstrap assets
        run: |
          npm run runtime:prepare-android-defaults -- \
            --asset-root build/runtime/android-assets \
            --jni-root build/runtime/android-jni-libs \
            --certificate build/runtime/signing/runtime-cert.pem \
            --pack build/runtime/release/linux-base-1.3.8-arm64-v8a.sarpack \
            --pack build/runtime/release/python-uv-0.12.1-arm64-v8a.sarpack
          npm run runtime:verify-android-defaults -- \
            --asset-root build/runtime/android-assets \
            --jni-root build/runtime/android-jni-libs
          node --test tools/runtime/android-default-runtime.test.mjs

      - name: Upload Android default runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: SignalASI-Android-default-runtime-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            build/runtime/android-assets/runtime/bootstrap
            build/runtime/release/linux-base-1.3.8-arm64-v8a.sarpack
            build/runtime/release/python-uv-0.12.1-arm64-v8a.sarpack


  build-python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME_SIGNING_CERTIFICATE: ${{ secrets.RUNTIME_SIGNING_CERTIFICATE }}
      RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.RUNTIME_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python runtime packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssl squashfs-tools xz-utils

      - name: Prepare runtime signing identity
        run: |
          mkdir -p build/runtime/signing
          if [[ -n "$RUNTIME_SIGNING_CERTIFICATE" && -n "$RUNTIME_SIGNING_PRIVATE_KEY" ]]; then
            printf '%s\n' "$RUNTIME_SIGNING_CERTIFICATE" > build/runtime/signing/runtime-cert.pem
            printf '%s\n' "$RUNTIME_SIGNING_PRIVATE_KEY" > build/runtime/signing/runtime-key.pem
          else
            openssl req -x509 -newkey rsa:3072 -nodes -days 7 \
              -subj "/CN=SignalASI Android Runtime Development/" \
              -keyout build/runtime/signing/runtime-key.pem \
              -out build/runtime/signing/runtime-cert.pem
          fi

      - name: Build signed standalone Python runtime
        run: |
          mkdir -p build/runtime/release
          npm run runtime:build-python-uv -- \
            "$PWD/build/runtime/release/python-uv-0.12.1-arm64-v8a.img"
          npm run runtime:build-pack -- \
            --config build/runtime/release/python-uv-0.12.1-arm64-v8a.img.config.json \
            --output build/runtime/release/python-uv-0.12.1-arm64-v8a.sarpack \
            --certificate build/runtime/signing/runtime-cert.pem \
            --key build/runtime/signing/runtime-key.pem

      - name: Upload standalone Android Python runtime
        uses: actions/upload-artifact@v4
        with:
          name: SignalASI-Android-python-uv-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            build/runtime/signing/runtime-cert.pem
            build/runtime/release/python-uv-0.12.1-arm64-v8a.sarpack
            build/runtime/release/python-uv-0.12.1-arm64-v8a.sarpack.metadata.json
