name: iOS Ad Hoc IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        required: true
        type: choice
        default: Release
        options:
          - Release
          - Debug
      publish_release:
        description: Also publish the IPA to a GitHub Release
        required: true
        type: boolean
        default: false
      offline_bundle:
        description: Embed local models plus the non-jailbroken iOS Debian runtime
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - .github/workflows/ios-adhoc-ipa.yml
      - apps/ios/**

permissions:
  contents: write

concurrency:
  group: ios-adhoc-ipa-${{ github.ref }}
  # A Linux rootfs rebuild is expensive; queue newer IPA requests instead of
  # repeatedly abandoning an in-progress full offline build.
  cancel-in-progress: false

env:
  IOS_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
  PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
  IOS_OFFLINE_BUNDLE: ${{ github.event_name != 'workflow_dispatch' || inputs.offline_bundle }}

jobs:
  build-linux-image:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.offline_bundle }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3

      - name: Build SignalASI Linux 1.3.9 kernel image
        run: |
          set -euo pipefail
          npm run runtime:build-linux-base -- build/runtime/ios/linux-base-1.3.9-aarch64.Image
          test -s build/runtime/ios/linux-base-1.3.9-aarch64.Image
          sha256sum build/runtime/ios/linux-base-1.3.9-aarch64.Image

      - name: Upload verified Linux kernel image
        uses: actions/upload-artifact@v4
        with:
          name: SignalASI-iOS-linux-base-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: build/runtime/ios/linux-base-1.3.9-aarch64.Image

  build-ipa:
    needs: build-linux-image
    if: ${{ always() && (needs.build-linux-image.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.offline_bundle)) }}
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Download verified Linux kernel image
        if: env.IOS_OFFLINE_BUNDLE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SignalASI-iOS-linux-base-${{ github.sha }}
          path: build/runtime/ios

      - name: Stage verified offline iOS runtime payload
        if: env.IOS_OFFLINE_BUNDLE == 'true'
        run: |
          set -euo pipefail
          MODELS_DIR="$PWD/apps/ios/SignalASI/voice/models"
          LOCAL_MODELS_DIR="$PWD/apps/ios/SignalASI/local-models"
          BOOTSTRAP_DIR="$PWD/apps/ios/SignalASI/runtime-bootstrap"
          UTM_SE_IPA="$PWD/build/ios/utm/UTM-SE-4.7.5.ipa"
          UTM_SE_ARCHIVED_FRAMEWORKS="$PWD/build/ios/utm/Payload/UTM SE.app/Frameworks"
          UTM_SE_FRAMEWORKS="$PWD/build/ios/utm/Frameworks"
          LINUX_IMAGE="$PWD/build/runtime/ios/linux-base-1.3.9-aarch64.Image"

          verify_file() {
            python3 - "$1" "$2" "$3" "$4" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected_size = int(sys.argv[2])
          expected_hash = sys.argv[3]
          label = sys.argv[4]
          if not path.is_file() or path.stat().st_size != expected_size:
              raise SystemExit(f"{label} has an unexpected size")
          digest_state = hashlib.sha256()
          with path.open("rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  digest_state.update(block)
          digest = digest_state.hexdigest()
          if digest != expected_hash:
              raise SystemExit(f"{label} failed SHA-256 verification")
          PY
          }

          download_model() {
            local name="$1"
            local expected_size="$2"
            local expected_hash="$3"
            local destination="$MODELS_DIR/$name"
            mkdir -p "$MODELS_DIR"
            if [[ -f "$destination" ]] && verify_file "$destination" "$expected_size" "$expected_hash" "$name"; then
              return
            fi
            rm -f "$destination" "$destination.partial"
            for source in \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$name" \
              "https://hf-mirror.com/ggerganov/whisper.cpp/resolve/main/$name"; do
              if curl --fail --location --retry 3 --retry-all-errors "$source" --output "$destination.partial"; then
                if verify_file "$destination.partial" "$expected_size" "$expected_hash" "$name"; then
                  mv "$destination.partial" "$destination"
                  return
                fi
              fi
              rm -f "$destination.partial"
            done
            echo "Could not download a verified $name" >&2
            exit 1
          }

          download_model ggml-tiny.bin 77691713 be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
          download_model ggml-small.bin 487601967 1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b

          LOCAL_MODEL="LFM2.5-350M-Q8_0.gguf"
          LOCAL_MODEL_PATH="$LOCAL_MODELS_DIR/$LOCAL_MODEL"
          mkdir -p "$LOCAL_MODELS_DIR"
          if [[ ! -f "$LOCAL_MODEL_PATH" ]] || ! verify_file "$LOCAL_MODEL_PATH" 379217632 be036a757295e550098b85e13f6af2735d0fa73b41e1156a40c7d8e8e32a5766 "LFM2.5 350M"; then
            rm -f "$LOCAL_MODEL_PATH" "$LOCAL_MODEL_PATH.partial"
            for source in \
              "https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/main/$LOCAL_MODEL" \
              "https://hf-mirror.com/LiquidAI/LFM2.5-350M-GGUF/resolve/main/$LOCAL_MODEL"; do
              if curl --fail --location --retry 3 --retry-all-errors "$source" --output "$LOCAL_MODEL_PATH.partial" && \
                  verify_file "$LOCAL_MODEL_PATH.partial" 379217632 be036a757295e550098b85e13f6af2735d0fa73b41e1156a40c7d8e8e32a5766 "LFM2.5 350M"; then
                mv "$LOCAL_MODEL_PATH.partial" "$LOCAL_MODEL_PATH"
                break
              fi
              rm -f "$LOCAL_MODEL_PATH.partial"
            done
            verify_file "$LOCAL_MODEL_PATH" 379217632 be036a757295e550098b85e13f6af2735d0fa73b41e1156a40c7d8e8e32a5766 "LFM2.5 350M"
          fi

          test -s "$LINUX_IMAGE"
          cp "$LINUX_IMAGE" "$BOOTSTRAP_DIR/linux-base-1.3.9-aarch64.Image"

          mkdir -p "$(dirname "$UTM_SE_IPA")"
          if [[ ! -f "$UTM_SE_IPA" ]] || ! verify_file "$UTM_SE_IPA" 213878374 ccb8529b8b8781410ff481e4ffbdf0d1b47ce5d431031e782e4b6f9601cac06d "UTM SE 4.7.5"; then
            rm -f "$UTM_SE_IPA" "$UTM_SE_IPA.partial"
            curl --fail --location --retry 3 --retry-all-errors \
              "https://github.com/utmapp/UTM/releases/download/v4.7.5/UTM-SE.ipa" \
              --output "$UTM_SE_IPA.partial"
            verify_file "$UTM_SE_IPA.partial" 213878374 ccb8529b8b8781410ff481e4ffbdf0d1b47ce5d431031e782e4b6f9601cac06d "UTM SE 4.7.5"
            mv "$UTM_SE_IPA.partial" "$UTM_SE_IPA"
          fi
          rm -rf "$PWD/build/ios/utm/Payload" "$UTM_SE_FRAMEWORKS"
          /usr/bin/unzip -q "$UTM_SE_IPA" 'Payload/UTM SE.app/Frameworks/*' -d "$PWD/build/ios/utm"
          /usr/bin/ditto "$UTM_SE_ARCHIVED_FRAMEWORKS" "$UTM_SE_FRAMEWORKS"
          test -d "$UTM_SE_FRAMEWORKS/qemu-aarch64-softmmu.framework"
          find "$UTM_SE_FRAMEWORKS" -maxdepth 1 -type d -name '*.framework' -print | sort > "$BOOTSTRAP_DIR/utm-se-frameworks.txt"

      - name: Build SignalASI for iPhoneOS
        env:
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          DERIVED_DATA="$PWD/build/ios/DerivedData"
          rm -rf "$DERIVED_DATA"
          BUILD_SETTINGS=()
          SIGNING_SETTINGS=(
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            DEVELOPMENT_TEAM=""
          )
          if [[ -n "${IOS_SIGNING_CERTIFICATE_BASE64:-}" && -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" && -n "${IOS_DEVELOPMENT_TEAM:-}" ]]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/signalasi-ios-signing.keychain-db"
            KEYCHAIN_PASSWORD="${IOS_SIGNING_KEYCHAIN_PASSWORD:-$(uuidgen)}"
            CERTIFICATE_PATH="$RUNNER_TEMP/signalasi-ios-signing.p12"
            PROFILE_PATH="$RUNNER_TEMP/signalasi-ios.mobileprovision"
            echo "$IOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "${IOS_SIGNING_CERTIFICATE_PASSWORD:-}" -A -T /usr/bin/codesign
            security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            SIGNING_SETTINGS=(
              CODE_SIGNING_ALLOWED=YES
              CODE_SIGNING_REQUIRED=YES
              CODE_SIGN_STYLE=Manual
              DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM"
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
              CODE_SIGN_IDENTITY="${IOS_SIGNING_IDENTITY:-Apple Development}"
            )
            echo "IOS_APP_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "IOS_APP_SIGNING_IDENTITY=${IOS_SIGNING_IDENTITY:-Apple Development}" >> "$GITHUB_ENV"
          else
            echo "IOS_APP_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          fi
          if [[ "$IOS_OFFLINE_BUNDLE" == "true" ]]; then
            BUILD_SETTINGS+=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SIGNALASI_NATIVE_LLAMA SIGNALASI_NATIVE_WHISPER SIGNALASI_OFFLINE_BUNDLE')
          fi
          xcodebuild \
            -jobs 1 \
            -project apps/ios/SignalASI.xcodeproj \
            -scheme SignalASI \
            -configuration "$IOS_CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            "${SIGNING_SETTINGS[@]}" \
            "${BUILD_SETTINGS[@]}" \
            build

      - name: Package ad-hoc IPA
        id: package
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          DERIVED_DATA="$PWD/build/ios/DerivedData"
          PRODUCT_DIR="$DERIVED_DATA/Build/Products/${IOS_CONFIGURATION}-iphoneos"
          APP_PATH="$PRODUCT_DIR/SignalASI.app"
          PACKAGE_ROOT="$PWD/build/ios/package"
          PAYLOAD_DIR="$PACKAGE_ROOT/Payload"
          DIST_DIR="$PWD/build/ios/dist"
          IPA_NAME="SignalASI-iOS-${IOS_CONFIGURATION}-${SHORT_SHA}-adhoc.ipa"
          APP_ZIP_NAME="SignalASI-iOS-${IOS_CONFIGURATION}-${SHORT_SHA}.app.zip"
          NOTES_NAME="SignalASI-iOS-${IOS_CONFIGURATION}-${SHORT_SHA}-install-notes.txt"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "SignalASI.app was not found under $PRODUCT_DIR." >&2
            find "$DERIVED_DATA/Build/Products" -maxdepth 4 -type d -name '*.app' -print >&2 || true
            exit 1
          fi

          rm -rf "$PACKAGE_ROOT" "$DIST_DIR"
          mkdir -p "$PAYLOAD_DIR" "$DIST_DIR"
          /usr/bin/ditto "$APP_PATH" "$PAYLOAD_DIR/SignalASI.app"

          if [[ "$IOS_OFFLINE_BUNDLE" == "true" ]]; then
            UTM_FRAMEWORKS="$PWD/build/ios/utm/Frameworks"
            test -d "$UTM_FRAMEWORKS/qemu-aarch64-softmmu.framework"
            mkdir -p "$PAYLOAD_DIR/SignalASI.app/Frameworks"
            find "$UTM_FRAMEWORKS" -mindepth 1 -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              while IFS= read -r -d '' framework; do
                /usr/bin/ditto "$framework" "$PAYLOAD_DIR/SignalASI.app/Frameworks/$(basename "$framework")"
              done
          fi

          if [[ "${IOS_APP_SIGNING_ENABLED:-false}" == "true" ]]; then
            /usr/bin/codesign --force --deep --sign "$IOS_APP_SIGNING_IDENTITY" --timestamp=none "$PAYLOAD_DIR/SignalASI.app"
          else
            /usr/bin/codesign --force --deep --sign - --timestamp=none "$PAYLOAD_DIR/SignalASI.app"
          fi
          /usr/bin/codesign --display --verbose=2 "$PAYLOAD_DIR/SignalASI.app" || true

          (
            cd "$PACKAGE_ROOT"
            /usr/bin/zip -qry "$DIST_DIR/$IPA_NAME" Payload
          )
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD_DIR/SignalASI.app" "$DIST_DIR/$APP_ZIP_NAME"

          cat > "$DIST_DIR/$NOTES_NAME" <<EOF
          SignalASI iOS ad-hoc build

          File:
          - $IPA_NAME

          Bundle:
          - com.signalasi.chat.ios

          Minimum iOS:
          - iOS 15.0

          Offline payload:
          - $([[ "$IOS_OFFLINE_BUNDLE" == "true" ]] && echo "LFM2.5 350M local Agent model, Whisper Tiny and Small, UTM SE 4.7.5 no-JIT QEMU frameworks, and the SignalASI Linux 1.3.9 Debian baseline are embedded." || echo "Not embedded in this slim build.")

          Signing:
          - $([[ "${IOS_APP_SIGNING_ENABLED:-false}" == "true" ]] && echo "Signed with the configured Apple certificate and provisioning profile for non-jailbroken iPhone installation." || echo "Ad-hoc signed test package; configure the iOS signing GitHub Secrets to install on a normal locked iPhone.")
          EOF

          DSYM_PATH="$PRODUCT_DIR/SignalASI.app.dSYM"
          if [[ -d "$DSYM_PATH" ]]; then
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$DSYM_PATH" "$DIST_DIR/SignalASI-iOS-${IOS_CONFIGURATION}-${SHORT_SHA}.dSYM.zip"
          fi

          echo "ipa=$DIST_DIR/$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "app_zip=$DIST_DIR/$APP_ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "notes=$DIST_DIR/$NOTES_NAME" >> "$GITHUB_OUTPUT"
          echo "dist=$DIST_DIR" >> "$GITHUB_OUTPUT"
          ls -lah "$DIST_DIR"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalASI-iOS-${{ env.IOS_CONFIGURATION }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.dist }}/*

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="ios-adhoc-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          TITLE="SignalASI iOS ad-hoc build ${SHORT_SHA}"
          NOTES="${{ steps.package.outputs.notes }}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/ios/dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/ios/dist/* \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --repo "$GITHUB_REPOSITORY"
          fi
