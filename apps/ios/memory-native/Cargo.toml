[package]
name = "galaxyssi-ios-memory"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
name = "GalaxySSIMemory"
crate-type = ["cdylib"]

[dependencies]
galaxyssi-memory-native = { path = "../../android/memory-native", version = "=0.6.0", default-features = false, features = ["sqlite-store"] }
tokio = { version = "=1.48.0", features = ["rt"] }
zeroize = "=1.8.2"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
